version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: cybertwin-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: cybertwin-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  ml-engine:
    build:
      context: ..
      dockerfile: docker/ml_engine.Dockerfile
    container_name: cybertwin-ml-engine
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    container_name: cybertwin-dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend
