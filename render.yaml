# cybertwin-ai/render.yaml
# Render Blueprint Configuration (100% Free Tier Optimized for Hackathons)

databases:
  - name: cybertwin-postgres
    databaseName: cybertwindb
    user: cybertwin_admin
    plan: free

services:
  # 1. Managed Redis (Used for Feature Store & Message Broker)
  - type: redis
    name: cybertwin-redis
    plan: free
    ipAllowList: [] # Only internal Render services can access this

  # 2. FastAPI Backend & Ingest API
  - type: web
    name: cybertwin-api
    env: python
    region: ohio
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "python -m backend.app.main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybertwin-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cybertwin-redis
          property: connectionString
      - key: ENVIRONMENT
        value: "production"
      - key: CORS_ORIGINS
        value: "*"

  # 3. React + Vite Analyst Dashboard (Free Static Site)
  - type: web
    name: cybertwin-dashboard
    env: static
    buildCommand: "cd dashboard && npm install && npm run build"
    staticPublishPath: "./dashboard/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://cybertwin-api.onrender.com/api/v1"
      - key: VITE_WS_URL
        value: "wss://cybertwin-api.onrender.com/api/v1/ws/alerts"
